name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: email_platform
          POSTGRES_PASSWORD: email_platform
          POSTGRES_DB: email_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_platform -d email_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy src
      - name: Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://email_platform:email_platform@localhost:5432/email_platform
        run: alembic upgrade head
      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://email_platform:email_platform@localhost:5432/email_platform
        run: pytest

services:
  managed-smtp-postfix:
    build:
      context: ./postfix
    environment:
      POSTFIX_MYHOSTNAME: ${POSTFIX_MYHOSTNAME:?set POSTFIX_MYHOSTNAME}
      POSTFIX_MYDOMAIN: ${POSTFIX_MYDOMAIN:?set POSTFIX_MYDOMAIN}
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:?set POSTFIX_MYNETWORKS}
      POSTFIX_RELAYHOST: ${POSTFIX_RELAYHOST:-}
      POSTFIX_DKIM_MILTER: inet:managed-smtp-opendkim:8891
      POSTFIX_TLS_CERT_FILE: ${POSTFIX_TLS_CERT_FILE:-/etc/postfix/tls/tls.crt}
      POSTFIX_TLS_KEY_FILE: ${POSTFIX_TLS_KEY_FILE:-/etc/postfix/tls/tls.key}
      POSTFIX_TLS_SECURITY_LEVEL: ${POSTFIX_TLS_SECURITY_LEVEL:-may}
      POSTFIX_OUTBOUND_TLS_SECURITY_LEVEL: ${POSTFIX_OUTBOUND_TLS_SECURITY_LEVEL:-may}
    ports:
      - "${POSTFIX_SMTP_PORT:-25}:25"
      - "${POSTFIX_SUBMISSION_PORT:-587}:587"
    volumes:
      - ${POSTFIX_SPOOL_DIR:?set POSTFIX_SPOOL_DIR}:/var/spool/postfix
      - ${POSTFIX_LOG_DIR:?set POSTFIX_LOG_DIR}:/var/log
      - ${MANAGED_SMTP_DSN_MAILDIR:?set MANAGED_SMTP_DSN_MAILDIR}:/var/mail/dsn
      - ${MANAGED_SMTP_DSN_ARCHIVE_DIR:?set MANAGED_SMTP_DSN_ARCHIVE_DIR}:/var/mail/dsn-archive
      - ${MANAGED_SMTP_DSN_QUARANTINE_DIR:?set MANAGED_SMTP_DSN_QUARANTINE_DIR}:/var/mail/dsn-quarantine
      - ${POSTFIX_TLS_DIR:?set POSTFIX_TLS_DIR}:/etc/postfix/tls:ro
    depends_on:
      - managed-smtp-opendkim
    restart: unless-stopped

  managed-smtp-opendkim:
    build:
      context: ./opendkim
    environment:
      OPENDKIM_DOMAINS: ${OPENDKIM_DOMAINS:?set OPENDKIM_DOMAINS}
      OPENDKIM_SELECTOR: ${OPENDKIM_SELECTOR:-ee1}
      OPENDKIM_TRUSTED_HOSTS: ${OPENDKIM_TRUSTED_HOSTS:-127.0.0.1 localhost managed-smtp-postfix}
    ports:
      - "127.0.0.1:${OPENDKIM_DEBUG_PORT:-8891}:8891"
    volumes:
      - ${OPENDKIM_KEYS_DIR:?set OPENDKIM_KEYS_DIR}:/etc/opendkim/keys:ro
      - managed-smtp-opendkim:/var/run/opendkim
    restart: unless-stopped

volumes:
  managed-smtp-opendkim:

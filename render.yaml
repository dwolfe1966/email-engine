services:
  - type: web
    name: email-engine
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_NAME
        value: Email Platform
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: email-engine-db
          property: connectionString
      - key: EMAIL_PROVIDER
        value: console
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: MANAGED_SMTP_FEEDBACK_SECRET
        sync: false

  - type: cron
    name: email-engine-managed-smtp-dsn-ingestion
    runtime: docker
    plan: starter
    schedule: "*/10 * * * *"
    dockerCommand: python scripts/managed_smtp_maintenance_runbook.py --skip-maintenance
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false
      - key: MANAGED_SMTP_FEEDBACK_SECRET
        sync: false
      - key: MANAGED_SMTP_DSN_PATH
        sync: false
      - key: MANAGED_SMTP_DSN_ARCHIVE
        sync: false

  - type: cron
    name: email-engine-managed-smtp-maintenance
    runtime: docker
    plan: starter
    schedule: "17 6 * * *"
    dockerCommand: python scripts/managed_smtp_maintenance_runbook.py --skip-dsn
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false
      - key: EMAIL_ENGINE_COOKIE
        sync: false

databases:
  - name: email-engine-db
    plan: starter

services:
  - type: web
    name: email-engine
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_NAME
        value: Email Platform
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: email-engine-db
          property: connectionString
      - key: EMAIL_PROVIDER
        value: console
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: MANAGED_SMTP_FEEDBACK_SECRET
        sync: false

  - type: cron
    name: email-engine-managed-smtp-dsn-ingestion
    runtime: docker
    plan: starter
    schedule: "*/10 * * * *"
    dockerCommand: python scripts/managed_smtp_maintenance_runbook.py --skip-maintenance
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false
      - key: MANAGED_SMTP_FEEDBACK_SECRET
        sync: false
      - key: MANAGED_SMTP_DSN_PATH
        sync: false
      - key: MANAGED_SMTP_DSN_ARCHIVE
        sync: false
      - key: MANAGED_SMTP_DSN_QUARANTINE
        sync: false

  - type: cron
    name: email-engine-managed-smtp-maintenance
    runtime: docker
    plan: starter
    schedule: "17 6 * * *"
    dockerCommand: python scripts/managed_smtp_maintenance_runbook.py --skip-dsn
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false
      - key: EMAIL_ENGINE_COOKIE
        sync: false

  - type: cron
    name: email-engine-managed-smtp-quarantine-check
    runtime: docker
    plan: starter
    schedule: "47 6 * * *"
    dockerCommand: python scripts/managed_smtp_dsn_quarantine.py --check --warning-count 5 --critical-count 25 --max-age-hours 24
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MANAGED_SMTP_DSN_QUARANTINE
        sync: false

  - type: cron
    name: email-engine-managed-smtp-readiness-notify
    runtime: docker
    plan: starter
    schedule: "*/15 * * * *"
    dockerCommand: python scripts/managed_smtp_readiness_notify.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BASE_URL
        sync: false
      - key: EMAIL_ENGINE_COOKIE
        sync: false
      - key: MANAGED_SMTP_READINESS_WEBHOOK_URL
        sync: false
      - key: MANAGED_SMTP_READINESS_WEBHOOK_AUTH_HEADER
        sync: false
      - key: MANAGED_SMTP_READINESS_WEBHOOK_AUTH_VALUE
        sync: false
      - key: MANAGED_SMTP_READINESS_WEBHOOK_FORMAT
        value: raw
      - key: MANAGED_SMTP_READINESS_NOTIFY_STATE
        value: /tmp/managed-smtp-readiness-notify.json

databases:
  - name: email-engine-db
    plan: starter
